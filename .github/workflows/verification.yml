name: HIL software and firmware verification

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run hardware-independent test suite
        run: python -m pytest -m "not hil" -q

      - name: Byte-compile host package
        run: python -m compileall -q host

      - name: Exercise deterministic software regression and evidence pipeline
        run: hilrig software-regression --output /tmp/hil-software-regression

  pico-firmware:
    name: Build RP2040 DUT and HIL firmware (Pico SDK 2.3.0)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Fetch official Raspberry Pi Pico SDK 2.3.0
        run: |
          git clone --depth 1 --branch 2.3.0 --recurse-submodules --shallow-submodules \
            https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"

      - name: Build DUT Pico firmware
        run: |
          cmake -S firmware/dut_pico -B "$RUNNER_TEMP/build-dut" \
            -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" \
            -DPICO_BOARD=pico
          cmake --build "$RUNNER_TEMP/build-dut" --parallel 2

      - name: Build HIL Pico firmware
        run: |
          cmake -S firmware/hil_pico -B "$RUNNER_TEMP/build-hil" \
            -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" \
            -DPICO_BOARD=pico
          cmake --build "$RUNNER_TEMP/build-hil" --parallel 2

      - name: Package Pico UF2 artifacts and checksums
        run: |
          mkdir -p "$RUNNER_TEMP/pico-artifacts"
          cp "$RUNNER_TEMP/build-dut/hil_dut_pico.uf2" "$RUNNER_TEMP/pico-artifacts/"
          cp "$RUNNER_TEMP/build-hil/hil_plant_pico.uf2" "$RUNNER_TEMP/pico-artifacts/"
          cd "$RUNNER_TEMP/pico-artifacts"
          sha256sum *.uf2 > SHA256SUMS.txt

      - name: Upload Pico firmware artifacts
        uses: actions/upload-artifact@v5
        with:
          name: hil-pico-firmware-${{ github.sha }}
          path: ${{ runner.temp }}/pico-artifacts

  uno-firmware:
    name: Build Arduino UNO Rev3 witness firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install Arduino AVR core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile UNO Rev3 witness sketch
        run: |
          mkdir -p "$RUNNER_TEMP/uno-build"
          arduino-cli compile --fqbn arduino:avr:uno --output-dir "$RUNNER_TEMP/uno-build" firmware/witness_uno
          cd "$RUNNER_TEMP/uno-build"
          sha256sum * > SHA256SUMS.txt

      - name: Upload UNO firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: hil-uno-witness-${{ github.sha }}
          path: ${{ runner.temp }}/uno-build
